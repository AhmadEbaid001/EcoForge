# One origin for the application and its API, so the browser never makes a
# cross-origin request and there is no CORS configuration anywhere to get wrong.
#
# Grafana is gone. The dashboards it hosted are now views inside the application,
# which removes a second service, a second login, a second set of credentials, and
# the standing problem that its panels queried the database with their own SQL and so
# could disagree with the application about what a number meant.

server {
    listen 80;
    server_name _;

    # Nothing outbound. The demonstration has to work with the network unplugged, so
    # every asset is served from disk.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # The satellite basemap is fifteen megabytes, and `no-store` below would make
    # the browser fetch it again on every visit to the map. The rule that header
    # exists for is a stale MODULE talking to a fresh API; a year-old photograph
    # of Cairo cannot do that, and it is refreshed by hand rather than by a
    # deploy, so a day of caching costs nothing and saves the map screen from
    # re-downloading its ground every time somebody navigates back to it.
    #
    # The manifest beside it is deliberately NOT excepted: it is small, it names
    # the image, and leaving it uncached is what makes a refreshed basemap show up
    # within a day rather than whenever a browser decides to look.
    #
    # Every security header is repeated here because nginx does not merge
    # add_header: a location that declares even one of its own discards the
    # entire inherited set. That is not a style preference, it is how this file
    # once shipped the application with no Content-Security-Policy at all.
    location = /data/basemap.jpg {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    }

    location /api/ {
        proxy_pass http://core:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The application reads the FIRST entry of this header for audit rows and
        # rate-limit keys. Setting it here rather than appending means a client cannot
        # forge the value it will be identified by.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The budget slider re-solves on every drag; keep the connection warm.
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://core:8000/health;
        access_log off;
    }

    location /docs {
        proxy_pass http://core:8000/docs;
    }

    location /openapi.json {
        proxy_pass http://core:8000/openapi.json;
    }

    # Defence in depth: the application sets these on its own responses, but static
    # files never reach it. Without them the HTML and JavaScript - the parts an
    # attacker would most like to frame or have sniffed as another type - would be the
    # only responses served without any.
    #
    # These live at SERVER level and every one of them must stay here. nginx does not
    # merge add_header directives: a location block that declares even one of its own
    # discards the entire inherited set for that location. A `location = /index.html`
    # that set nothing but Cache-Control did exactly that here, and the page carrying
    # the whole application shipped with no Content-Security-Policy at all while every
    # API response had one. Anything location-specific has to repeat the full set.
    #
    # Nothing is cached, deliberately. There is no build step and therefore no
    # cache-busting in asset names, so a cached module is how someone ends up running
    # last week's application against this week's API - and a page rendered for one
    # user and served to the next is a data leak that looks like a performance win.
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    # Do not advertise the version to anyone scanning for a matching CVE.
    server_tokens off;

    # A signed reading is a few hundred bytes; a portfolio GeoJSON is not.
    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    # ---------------------------------------------------------------------
    # TLS
    #
    # Commented out because the demonstration runs on an air-gapped network over
    # http://localhost, where a Secure cookie would never be sent and the login would
    # appear to work while every later request came back anonymous.
    #
    # For any deployment reachable over a network, uncomment this, mount a
    # certificate, and set GEMP_COOKIE_SECURE=true. The application's /admin/security
    # view reports that flag, so the two cannot silently disagree.
    #
    # listen 443 ssl;
    # ssl_certificate     /etc/nginx/tls/fullchain.pem;
    # ssl_certificate_key /etc/nginx/tls/privkey.pem;
    # ssl_protocols       TLSv1.2 TLSv1.3;
    # ssl_ciphers         HIGH:!aNULL:!MD5;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # ---------------------------------------------------------------------
}
