# One origin for the map, the API and Grafana, so the browser never sees a
# cross-origin request and no CORS configuration is needed anywhere.

server {
    listen 80;
    server_name _;

    # No outbound anything: the demonstration must work with the network unplugged.
    # Map tiles are served from disk (see web/tiles), not from a public tile server.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://core:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The budget slider re-solves on every drag; keep the connection warm.
        proxy_read_timeout 30s;
    }

    location /health {
        proxy_pass http://core:8000/health;
        access_log off;
    }

    location /docs {
        proxy_pass http://core:8000/docs;
    }

    location /openapi.json {
        proxy_pass http://core:8000/openapi.json;
    }

    location /grafana/ {
        proxy_pass http://grafana:3000/;
        proxy_set_header Host $host;
    }

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;
}
