# Mosquitto is the hardware seam. A physical ESP32 node publishes the same message
# shape to the same topic as the simulator, and nothing downstream can tell the
# difference - which is what makes the "extend to real hardware" claim concrete
# rather than aspirational.

listener 1883
protocol mqtt

# Anonymous access is off. The port is already bound to loopback in
# docker-compose.yml, but a broker that accepts unauthenticated publishes is a
# broker that will accept them the first time someone exposes it for a demo.
allow_anonymous false
password_file /mosquitto/config/passwd

# Survive a broker restart without losing queued readings.
persistence true
persistence_location /mosquitto/data/

# Keep messages for subscribers that reconnect (the ingester restarting, say).
max_queued_messages 10000
message_size_limit 8192

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
