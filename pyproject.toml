[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gemp"
version = "0.1.0"
description = "Green Energy Monitoring Platform - budget-constrained retrofit decision support"
requires-python = ">=3.11"

dependencies = [
    # --- core domain + optimizer (Phase 0: these alone must be enough) ---
    "ortools>=9.10",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pandas>=2.1",

    # --- API (Phase 1) ---
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic-settings>=2.2",

    # --- persistence (Phase 1) ---
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",

    # --- ingestion (Phase 1) ---
    "paho-mqtt>=2.0",

    # --- ML (Phase 2) ---
    "scikit-learn>=1.4",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "hypothesis>=6.98",
    "ruff>=0.3",
    "httpx>=0.27",
    "matplotlib>=3.8",
]

[project.scripts]
gemp-optimize = "gemp.optimize.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
