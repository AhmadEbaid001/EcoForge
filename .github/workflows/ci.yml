# The gates, the security review, and the image the deploy workflow consumes.
#
# Three jobs, ordered by how fast they fail. `gates` is the four checks
# `scripts/check.py` runs locally and takes about three minutes; `security` runs
# every scanner and is allowed to take longer; `build` happens only if both passed,
# because there is no reason to push an image nobody may deploy.
#
# The security policy is BLOCK ON ANYTHING. Every scanner writes SARIF into
# reports/ and `scripts/security_gate.py` returns the single verdict, applying the
# exception register in .security/allowlist.yml - the only way past a finding, and
# one that expires. See that file for why it is a file and not a flag.
#
# No database service. The suite runs against SQLite by design and the PostgreSQL
# integration tests skip themselves when nothing is listening, so CI stays short.
# Running the container stack here would test Docker's networking, not the platform.
#
# On pinning: actions are referenced by major tag. Pinning to a commit SHA is
# stricter and is the right end state - `gh api` resolves the current SHA for each -
# but a wrong SHA is a build that cannot run at all, so it is a deliberate follow-up
# rather than a value guessed here. Dependabot watches these tags.
#
# A wrong TAG is the same failure and it is easier to write: trivy-action was
# referenced as `@0.28.0` when the tag it publishes is `v0.28.0`. GitHub resolves
# every action in a job before running any step, so the whole secure review died
# in three seconds at `Set up job` and had never once executed a scanner. That
# reads as a security failure in the Actions list and is nothing of the kind.
# `gh api repos/<owner>/<repo>/git/ref/tags/<tag>` says whether a tag exists.
name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Read-only by default. Each job asks for exactly what it needs and nothing else, so
# a compromised action in one job cannot write to the repository from another.
permissions:
  contents: read

# One run per ref. A push landing on top of a running build cancels it rather than
# racing it to the registry.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # NOT `github.repository`. That preserves the case the repository was created
  # with - AhmadEbaid001/EcoForge - and an OCI reference must be lower case, so
  # `cosign sign ghcr.io/AhmadEbaid001/EcoForge@sha256:...` fails with "could not
  # parse reference" after the image has already been pushed. docker/metadata-action
  # lowercases on its own, which is why the push succeeded and only the hand-built
  # references broke. Each job that needs it derives the lower-case name in a step,
  # because workflow-level env cannot call a function.
  IMAGE: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------- gates
  gates:
    name: gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src tests scripts

      - name: Tests
        # Floor measured at 83% locally; see COVERAGE_FLOOR in scripts/check.py for
        # what the number is and is not for.
        run: python -m pytest -q --cov --cov-fail-under=80

      - name: Data contract
        # Structure only. `--strict` additionally fails on uncited catalog rows, which
        # is a known open item owned by a person, not a regression a build can fix.
        run: python -m gemp.domain.catalog --validate

      - name: Claims
        # Re-measures every claim the paper makes and exits 1 if one has stopped
        # holding. Known-open findings report FAIL and do not fail the run.
        run: python -m gemp.evaluate --quick --no-figures

      - name: Citation status
        # Reported on every run so the uncited rows stay visible, without turning a
        # permanently red gate into something everyone learns to ignore.
        if: always()
        continue-on-error: true
        run: python -m gemp.domain.catalog --validate --strict

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation
          path: out/evaluation/
          if-no-files-found: ignore

  # ------------------------------------------------------ secure code review
  security:
    name: secure code review
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      # SARIF upload, so findings appear on the pull request and in the Security tab
      # rather than only in a log nobody opens.
      security-events: write
      # gitleaks-action reads the run it is part of to decide whether the repository
      # needs a licence. Without this it cannot, and posts a red annotation -
      # `Resource not accessible by integration` - onto an otherwise green run.
      actions: read

    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks reads history, not only the tip: a secret committed and later
          # removed is still a secret that was published.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: mkdir -p reports reports-informational

      - name: Install scanners
        # The build toolchain gets upgraded first because pip-audit audits the
        # environment it runs in, and the setuptools inside setup-python's 3.11 is
        # 65.5.0 - seven advisories, including a path traversal in PackageIndex.
        # Without this the gate blocks on the runner's own preinstalled packages,
        # which is a finding about GitHub's image rather than about this project.
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]" "bandit[sarif]" semgrep pip-audit

      # -- static analysis of our own code ---------------------------------
      - name: Bandit
        continue-on-error: true
        run: bandit -r src scripts -f sarif -o reports/bandit.sarif

      - name: Semgrep
        continue-on-error: true
        run: |
          semgrep scan \
            --config p/python \
            --config p/security-audit \
            --config p/secrets \
            --config p/owasp-top-ten \
            --sarif --output reports/semgrep.sarif \
            --metrics off \
            src scripts

      # -- what we depend on ------------------------------------------------
      - name: pip-audit
        continue-on-error: true
        run: pip-audit --format json --output reports/pip-audit.json --progress-spinner off

      # -- secrets, including ones already deleted --------------------------
      - name: Gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"
          GITLEAKS_SARIF_PATH: reports/gitleaks.sarif
          # Named rather than discovered, so a rename of the file is a failing build
          # instead of a scan that quietly stops applying its one exception.
          GITLEAKS_CONFIG: .gitleaks.toml

      # -- how we build it and how we run it --------------------------------
      - name: Hadolint
        continue-on-error: true
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: infra/Dockerfile
          format: sarif
          output-file: reports/hadolint.sarif
          no-fail: true

      - name: Trivy filesystem, config and IaC
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          format: sarif
          output: reports/trivy-fs.sarif
          # The gate decides what blocks, not the scanner. One policy, one place.
          exit-code: "0"
          # See the image scan below for why unfixed advisories are reported
          # separately rather than blocking.
          ignore-unfixed: true

      - name: Build the image for scanning
        run: docker build -f infra/Dockerfile -t gemp:scan .

      # Two passes over the same image, and the difference between them is the
      # whole policy.
      #
      # Debian ships python:3.11-slim with roughly 120 open advisories that have no
      # patched version in any repository - not "not upgraded yet", but nothing to
      # upgrade TO. Blocking on those makes a red build the permanent state of the
      # world, and a gate that is always red is a gate everybody learns to click
      # past. So the blocking pass asks only about vulnerabilities with a published
      # fix, which the Dockerfile's apt upgrade layer then actually applies.
      #
      # The unfixable ones are not hidden. The second pass records all of them,
      # uploads them to the Security tab and keeps them as an artefact; they are
      # simply not treated as this build's fault. When Debian publishes a fix, the
      # next build pulls it and the finding moves from that list into this one.
      - name: Trivy image, fixable
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: gemp:scan
          scanners: vuln,secret
          format: sarif
          output: reports/trivy-image.sarif
          exit-code: "0"
          ignore-unfixed: true

      - name: Trivy image, everything including what cannot be fixed
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: gemp:scan
          scanners: vuln,secret
          format: sarif
          # Outside reports/, deliberately: the gate reads that directory and this
          # file is for people to look at, not for the build to fail on.
          output: reports-informational/trivy-image-all.sarif
          exit-code: "0"

      # -- one verdict -------------------------------------------------------
      - name: Publish findings to the Security tab
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports

      - name: Publish the unfixable findings too
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports-informational
          category: informational

      - name: Security gate
        # Every scanner above is `continue-on-error`, deliberately: a scanner that
        # crashed must not be indistinguishable from a scanner that found nothing,
        # and this step is what tells the two apart. It reads every report, applies
        # the exception register, and is the only step here allowed to fail the job.
        run: python scripts/security_gate.py reports --summary "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            reports/
            reports-informational/
          if-no-files-found: warn

  # ---------------------------------------------------------------- build
  build:
    name: build and sign
    needs: [gates, security]
    # Only ever from the default branch. A pull request from a fork must not be able
    # to push an image, and a green pull request is not a release.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      # Keyless signing: cosign exchanges this short-lived OIDC token for a
      # certificate. No private key exists to leak, rotate, or forget.
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: The registry path, in the case a registry accepts
        run: echo "IMAGE=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Emulation for the ARM build
        uses: docker/setup-qemu-action@v3

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          # amd64 for a laptop or an ordinary VPS, arm64 because the only
          # always-free tier large enough to run this honestly - Oracle's Ampere A1,
          # 4 cores and 24 GB - is ARM. Every dependency that matters here
          # (ortools, scikit-learn, pandas, numpy, psycopg) publishes a Linux
          # aarch64 wheel for cp311, so nothing is compiled from source and the ARM
          # build is not meaningfully slower than the x86 one.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the image
        # By DIGEST, never by tag. A tag can be moved to point at something else
        # after it is signed; a digest is the image.
        run: cosign sign --yes "${REGISTRY}/${IMAGE}@${DIGEST}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}

      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Attest the SBOM
        run: |
          cosign attest --yes \
            --predicate sbom.cyclonedx.json \
            --type cyclonedx \
            "${REGISTRY}/${IMAGE}@${DIGEST}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cyclonedx.json

      - name: Summary
        run: |
          {
            echo "## Image"
            echo
            echo '```'
            echo "${REGISTRY}/${IMAGE}@${DIGEST}"
            echo '```'
            echo
            echo "Signed keylessly, published with a CycloneDX SBOM attestation."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
