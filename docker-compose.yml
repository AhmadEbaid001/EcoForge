# Single-host deployment. Every component runs as a container on one machine, which
# is the proposal's Section 3.1 decision and the right one after the team lost time
# to managed free-tier suspensions.
#
# One change from the proposal: the LAPTOP is the primary demonstration host and the
# VM is the mirror, not the other way round. Venue networking is the highest-
# probability demo failure and it is the one thing the team cannot control. Nothing
# here reaches the internet at runtime.

name: gemp

services:
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    restart: always
    environment:
      POSTGRES_DB: ${GEMP_DB_NAME:-gemp}
      POSTGRES_USER: ${GEMP_DB_USER:-gemp}
      POSTGRES_PASSWORD: ${GEMP_DB_PASSWORD:?set GEMP_DB_PASSWORD in .env}
      # Consumed by infra/initdb/01-roles.sh. Nothing connects as this role today;
      # it is what the archived Grafana provisioning would use. See the note below.
      GEMP_DB_RO_USER: ${GEMP_DB_RO_USER:-gemp_ro}
      GEMP_DB_RO_PASSWORD: ${GEMP_DB_RO_PASSWORD:?set GEMP_DB_RO_PASSWORD in .env}
      # Sized for the target 4 vCPU / 8 GB host.
      TIMESCALEDB_TELEMETRY: "off"
    # One lock is taken per chunk AND per chunk index for the duration of a query
    # that touches them, and the lock table is shared: its size is
    # max_locks_per_transaction x max_connections. At the default 64 x 100 = 6,400
    # slots, a single `SELECT max(ts) FROM reading` across a hypertable with 1,300+
    # chunks can exhaust it, and every dashboard request starts with exactly that
    # query. The symptom is "out of shared memory / You might need to increase
    # max_locks_per_transaction", which is the server naming its own fix.
    #
    # The chunk count is a consequence of accelerated replay: at 720x, a one-day
    # chunk interval creates a chunk every two real minutes. See the interval set
    # in infra/initdb - together they stop this recurring.
    command:
      - postgres
      - -c
      - max_locks_per_transaction=1024
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      # Loopback only - never exposed to the network. Host port defaults to 5433
      # because a native PostgreSQL install commonly already holds 5432, and taking
      # it would break the developer's existing database rather than ours. Inside the
      # compose network everything still talks to `timescaledb:5432`.
      - "127.0.0.1:${GEMP_DB_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GEMP_DB_USER:-gemp} -d ${GEMP_DB_NAME:-gemp}"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 3g

  mosquitto:
    image: eclipse-mosquitto:2.0
    restart: always
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infra/mosquitto/passwd:/mosquitto/config/passwd:ro
      - ./infra/mosquitto/aclfile:/mosquitto/config/aclfile:ro
      - mosquitto_data:/mosquitto/data
    ports:
      - "127.0.0.1:1883:1883"
    # The password has NO default, deliberately. A fallback of "gemp" would mean a
    # host that skipped setup_mqtt_auth.py ships a broker whose credential is in the
    # compose file - and this broker accepts publishes that become readings.
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -p 1883 -t '$$SYS/#' -C 1 -W 3 -u ${GEMP_MQTT_USER:?set GEMP_MQTT_USER in .env} -P ${GEMP_MQTT_PASSWORD:?set GEMP_MQTT_PASSWORD in .env} || exit 1"]
      interval: 10s
      timeout: 6s
      retries: 10

  core:
    # Build from source by default, run a published image when one is named.
    #
    # GEMP_IMAGE is what makes `deploy.sh` and a local `docker compose up` the same
    # operation from compose's point of view: unset, this builds what is checked
    # out; set to a digest, `--no-build` runs exactly that artefact and nothing is
    # compiled on the host at all.
    image: ${GEMP_IMAGE:-gemp-core:local}
    build:
      context: .
      dockerfile: infra/Dockerfile
    restart: always
    env_file: .env
    environment:
      GEMP_DB_HOST: timescaledb
      GEMP_MQTT_HOST: mosquitto
      GEMP_DATA_DIR: /app/data
    volumes:
      - ./data:/app/data:ro
      # Integrity anchor lives OUTSIDE the postgres volume on purpose (F5): an
      # adversary who truncates the reading table must also reach this file.
      - ./anchor:/app/anchor
    depends_on:
      timescaledb:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  sim:
    # The same image as core - they differ only in the command they run.
    image: ${GEMP_IMAGE:-gemp-core:local}
    build:
      context: .
      dockerfile: infra/Dockerfile
    restart: always
    command: ["python", "-m", "gemp.sim.node"]
    env_file: .env
    environment:
      GEMP_MQTT_HOST: mosquitto
      GEMP_DB_HOST: timescaledb
      GEMP_DATA_DIR: /app/data
    volumes:
      - ./data:/app/data:ro
      # The node records every fault it injects to anchor/live_anomalies.jsonl. Without
      # this mount that file is written inside the container and dies with it, so the
      # live stream has no ground truth and the evaluation scores every correctly
      # detected live fault as a false alarm. Measured: episode precision read 0.26
      # instead of 0.50 once the simulator had run past the seeded window.
      - ./anchor:/app/anchor
    depends_on:
      mosquitto:
        condition: service_healthy
      core:
        condition: service_healthy
    # The image carries the API's health check. This service runs the simulator from
    # that same image and serves no HTTP, so inheriting it would report a perfectly
    # healthy node as unhealthy forever.
    healthcheck:
      disable: true

  nginx:
    image: nginx:1.27-alpine
    restart: always
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/usr/share/nginx/html:ro
    ports:
      # Loopback by default. Session cookies travel over plaintext HTTP (there is no
      # TLS on the air-gapped demo), so a port open on every interface hands any
      # passive listener on the same LAN a replayable seven-day session cookie.
      # To serve other devices, set GEMP_HTTP_BIND=0.0.0.0 in .env AND
      # GEMP_COOKIE_SECURE=true, and terminate TLS - the security posture view
      # reports that flag so the pairing cannot silently disagree.
      - "${GEMP_HTTP_BIND:-127.0.0.1}:${GEMP_HTTP_PORT:-8080}:80"
    depends_on:
      core:
        condition: service_started

  # Grafana used to run here. Its dashboards are now views inside the application,
  # which removes a second service, a second login and a second set of database
  # credentials - and removes the standing problem that its panels queried the
  # database with their own SQL and could therefore disagree with the application
  # about what a number meant. The provisioning files are kept under infra/grafana
  # so the Phase 3 work the paper describes is still on record, and they are still
  # checked by tests/test_grafana_archive.py - as an archive that would provision
  # cleanly, NOT as a service. Five containers is the whole stack, and that test
  # fails if a sixth appears here.

volumes:
  pgdata:
  mosquitto_data:
