<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Declared here as well as in the stylesheet so the browser paints its own
     surfaces - scrollbars, form controls, the canvas behind the first frame - in
     the right appearance before any CSS has been parsed. -->
<meta name="color-scheme" content="light dark">
<title>GEMP &mdash; Green Energy Monitoring Platform</title>
<!-- Same-origin files only: the CSP allows img-src 'self' and data:, so an icon
     fetched from anywhere else would be blocked like any other asset. The SVG
     serves every current browser; the PNG is for the ones that ignore SVG icons,
     and favicon.ico exists so /favicon.ico stops falling through to index.html. -->
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body class="booting">

<!--
  The shell is deliberately empty.

  Every screen is rendered by the application after it has asked the server who the
  caller is, which means an unauthenticated browser is never handed markup describing
  data it may not see - no half-drawn dashboard behind a login overlay, and nothing in
  the page source worth reading before signing in.

  Scripts are ES modules from this origin only. The Content-Security-Policy the server
  sends forbids anything else, so a CDN <script> added later would be blocked by the
  browser rather than silently breaking the offline guarantee (F13).
-->
<div id="root">
  <div class="login-wrap"><div class="loading">Loading&hellip;</div></div>
</div>

<noscript>
  <div class="login-wrap">
    <div class="error-box">
      This application needs JavaScript. It draws its own maps and charts rather than
      loading a charting library, so that it keeps working with the network unplugged.
    </div>
  </div>
</noscript>

<script type="module" src="js/app.js"></script>
</body>
</html>
